services:
  - type: web
    name: absensi-x-tkj1
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: absensi-data
      mountPath: /var/data
      sizeGB: 1
